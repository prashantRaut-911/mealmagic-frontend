<div class="auth-container d-flex justify-content-center align-items-center vh-100">
  <mat-card class="auth-card animate-fade-in">
    <h2 class="text-center text-primary mb-1">Welcome Back!</h2>
    <p class="text-center text-muted mb-4">Log in to order your favorite dishes.</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <!-- Email -->
      <mat-form-field appearance="outline" class="w-100 mb-3">
        <mat-label>Email</mat-label>
        <mat-icon matPrefix>email</mat-icon>
        <input matInput type="email" formControlName="email" placeholder="Enter your email">
        <mat-error *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          Please enter a valid email.
        </mat-error>
      </mat-form-field>

      <!-- Password -->
      <mat-form-field appearance="outline" class="w-100 mb-3">
        <mat-label>Password</mat-label>
        <mat-icon matPrefix>lock</mat-icon>
        <input matInput type="password" formControlName="password" placeholder="Enter your password">
        <mat-error *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          Password must be at least 6 characters.
        </mat-error>
      </mat-form-field>

      <!-- Forgot Password -->
      <div class="text-end mb-3">
        <a routerLink="/forgot-password" class="text-decoration-none text-secondary small">Forgot Password?</a>
      </div>

      <!-- Submit -->
      <button
        mat-raised-button
        color="primary"
        class="w-100 btn-orange"
        [disabled]="loginForm.invalid">
        {{ isSubmitting ? 'Logging in...' : 'Login' }}
      </button>
    </form>

    <p class="text-center mt-3 mb-0">
      Don’t have an account?
      <a routerLink="/signup" class="text-orange fw-bold text-decoration-none">Register here</a>
    </p>
  </mat-card>
</div>
