<div class="auth-container d-flex justify-content-center align-items-center vh-100">
  <mat-card class="auth-card animate-fade-in">
    <div class="text-center mb-3">
      <mat-icon class="text-orange" style="font-size: 27px;">lock_open</mat-icon>
    </div>

    <h2 class="text-center text-primary mb-1">Reset Your Password</h2>
    <p class="text-center text-muted mb-4">
      Enter your email and new password to reset it.
    </p>

    <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
      <!-- Email -->
      <mat-form-field appearance="outline" class="w-100 mb-3">
        <mat-label>Email</mat-label>
        <mat-icon matPrefix>email</mat-icon>
        <input matInput type="email" formControlName="email" placeholder="Enter your email" />
      </mat-form-field>

      <!-- OTP -->
      <div *ngIf="otpSent">
        <mat-form-field appearance="outline" class="w-100 mb-3">
          <mat-label>Enter OTP</mat-label>
          <mat-icon matPrefix>key</mat-icon>
          <input matInput type="text" formControlName="otp" placeholder="Enter OTP received via email" />
        </mat-form-field>
      </div>

      <!-- New Password -->
      <mat-form-field appearance="outline" class="w-100 mb-3">
        <mat-label>New Password</mat-label>
        <mat-icon matPrefix>lock_open</mat-icon>
        <input matInput type="password" formControlName="newPassword" placeholder="Enter new password" />
      </mat-form-field>

      <!-- Confirm New Password -->
      <mat-form-field appearance="outline" class="w-100 mb-3">
        <mat-label>Confirm New Password</mat-label>
        <mat-icon matPrefix>lock</mat-icon>
        <input matInput type="password" formControlName="confirmPassword" placeholder="Re-enter new password" />
      </mat-form-field>

      <!-- Buttons -->
      <div class="d-flex justify-content-between">
        <button
          mat-raised-button
          color="primary"
          class="btn-orange px-4"
          type="button"
          (click)="sendOtp()"
          [disabled]="forgotPasswordForm.get('email')?.invalid"
        >
          Send OTP
        </button>

        <button
          mat-raised-button
          color="accent"
          class="btn-success text-white px-4"
          type="submit"
          [disabled]="!otpSent || forgotPasswordForm.invalid"
        >
          Verify & Reset
        </button>
      </div>
    </form>

    <p class="text-center mt-3 mb-0 text-muted">
      Remembered your password?
      <a routerLink="/login" class="text-orange fw-bold text-decoration-none">Login here</a>
    </p>
  </mat-card>
</div>
