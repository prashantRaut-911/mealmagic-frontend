<div class="container mt-5 text-light">
  <h2 class="text-center mb-4 text-warning fw-bold">⭐ My Reviews</h2>

  <!-- Loader -->
  <div *ngIf="loading" class="text-center mt-5">
    <div class="spinner-border text-warning" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <!-- No Reviews -->
  <div *ngIf="!loading && reviews.length === 0" class="text-center mt-5">
    <h5 class="text-muted">You haven't written any reviews yet.</h5>
  </div>

  <!-- Reviews List -->
  <div class="row" *ngIf="!loading && reviews.length > 0">
    <div class="col-md-6 col-lg-4 mb-4" *ngFor="let review of reviews">
      <div class="card bg-dark border-warning h-100 shadow">
        <div class="card-body">
          <h5 class="card-title text-warning">
            🍽 {{ review.dish?.dishName }}
          </h5>
          <h6 class="card-subtitle mb-2 text-muted">
            Cuisine: {{ review.dish?.cuisine || 'N/A' }}
          </h6>

          <p class="mt-3 mb-2">
            <span class="text-warning">"{{ review.reviewText }}"</span>
          </p>

          <div class="d-flex justify-content-between align-items-center mt-3">
            <div>
              <small class="text-light">
                👤 {{ review.userId.username }}
              </small>
              <br />
              <small class="text-secondary">
                {{ review.createdAt | date: 'mediumDate' }}
              </small>
            </div>

            <div class="text-warning fw-bold fs-5">
              ⭐ {{ review.rating }}/5
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
